name:
  isotope:sqlcmd

replaces:
  brew:sqlcmd

build: |
  GOTOOLCHAIN=auto CGO_ENABLED=0 go test -mod=readonly ./internal/automicvault ./internal/config ./internal/sql ./cmd/modern/root/config
  mkdir -p bin
  GOTOOLCHAIN=auto CGO_ENABLED=0 GOOS=darwin GOARCH="$(go env GOARCH)" \
    go build -mod=readonly -trimpath \
    -ldflags "-s -w -X 'main.version=v${VERSION}' -X 'github.com/microsoft/go-sqlcmd/internal/automicvault.Enabled=true'" \
    -o bin/sqlcmd ./cmd/modern
  bin/sqlcmd --version | grep -F "v${VERSION}"
  codesign --force --options runtime --timestamp \
    --identifier sqlcmd \
    --sign "$CODESIGN_IDENTITY" \
    bin/sqlcmd
  tar czf out.tgz bin/sqlcmd

justification:
  title:
    Unprotected Credential Access
  detail: |
    Go sqlcmd stores basic-auth passwords as reversible base64 data in its
    default macOS sqlconfig, and its official macOS release is not eligible for
    process-bound Secret Application.

    This Isotope replaces supported password reads and mutations with fixed
    Automic Vault routes, binds reads to the sqlcmd user profile and endpoint,
    and rejects custom sqlconfig paths and unsupported authentication. Its
    reviewed release is signed with Hardened Runtime and no entitlements.
